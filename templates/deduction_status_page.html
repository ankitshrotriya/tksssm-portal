<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Deduction Status</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>

        body{
            background:#f4f6f9;
        }

        .main-box{
            min-height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border-radius:18px;
            border:none;
        }

        .title{
            font-size:28px;
            font-weight:700;
            color:#0d6efd;
        }

        .form-label{
            font-weight:600;
        }

        .select2-container .select2-selection--single{
            height:38px !important;
            padding-top:4px;
        }

        .status-box{
            font-size:18px;
            font-weight:700;
            text-align:center;
            letter-spacing:1px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="main-box">

        <div class="card shadow-lg p-4" style="width:750px;">

            <div class="text-center mb-4">

                <div class="title">
                    Loan / RD Deduction Status
                </div>

            </div>

            <!-- ROW 1 -->

            <div class="row justify-content-center">

                <!-- MEMBER -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Member No.
                    </label>

                    <select id="member_no" class="form-control">

                        <option value="">
                            Select Member
                        </option>

                        {% for member in members %}

                        <option value="{{ member.member_no }}">

                            {{ member.member_no }} - {{ member.member_name_eng }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <!-- ROW 2 -->

            <div class="row">

                <!-- TYPE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Account Type
                    </label>

                    <select id="account_type" class="form-control">

                        <option value="">
                            Select Type
                        </option>

                        <option value="loan">
                            Loan
                        </option>

                        <option value="rd">
                            RD
                        </option>

                    </select>

                </div>

                <!-- ACCOUNT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Loan / RD No.
                    </label>

                    <select id="account_no" class="form-control">

                        <option value="">
                            Select Account
                        </option>

                    </select>

                </div>

            </div>

            <!-- ROW 3 -->

            <div class="row mt-2">

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Current Deduction Status
                    </label>

                    <input type="text"
                           id="deduction_status"
                           class="form-control status-box"
                           readonly>

                </div>

            </div>

            <!-- BUTTON -->

            <div class="row mt-2">

                <div class="col-md-12">

                    <button class="btn btn-success w-100 py-2"
                            id="updateBtn">

                        Change Deduction Status

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    $(document).ready(function(){

        $("#member_no").select2({

            placeholder:"Select Member",
            allowClear:true,
            width:'100%'

        });

    });


    // =========================
    // LOAD ACCOUNTS
    // =========================

    $("#member_no, #account_type").change(function(){

        loadAccounts();

    });


    function loadAccounts(){

        let member_no = $("#member_no").val();

        let type = $("#account_type").val();

        if(member_no == "" || type == ""){

            return;

        }

        $.ajax({

            url : "/get_deduction_accounts",

            type : "POST",

            data : {

                member_no : member_no,
                type : type

            },

            success:function(response){

                $("#account_no").html(
                    '<option value="">Select Account</option>'
                );

                response.data.forEach(function(item){

                    $("#account_no").append(

                        `<option value="${item.account_no}">
                            ${item.display_name}
                        </option>`

                    );

                });

            }

        });

    }


    // =========================
    // GET STATUS
    // =========================

    $("#account_no").change(function(){

        let account_no = $(this).val();

        let type = $("#account_type").val();

        $.ajax({

            url : "/get_deduction_status_data",

            type : "POST",

            data : {

                account_no : account_no,
                type : type

            },

            success:function(response){

                $("#deduction_status").val(
                    response.status
                );

                if(response.status == "TRUE"){

                    $("#deduction_status").css({
                        "background":"#198754",
                        "color":"white"
                    });

                }else{

                    $("#deduction_status").css({
                        "background":"#dc3545",
                        "color":"white"
                    });

                }

            }

        });

    });


    // =========================
    // UPDATE STATUS
    // =========================

    $("#updateBtn").click(function(){

        let account_no = $("#account_no").val();

        let type = $("#account_type").val();

        let current_status = $("#deduction_status").val();

        if(account_no == ""){

            alert("Please select account");

            return;

        }

        let new_status = "TRUE";

        if(current_status == "TRUE"){

            new_status = "FALSE";

        }

        $.ajax({

            url : "/update_deduction_status_data",

            type : "POST",

            data : {

                account_no : account_no,
                type : type,
                status : new_status

            },

            success:function(response){

                alert(response.message);

                $("#deduction_status").val(new_status);

                if(new_status == "TRUE"){

                    $("#deduction_status").css({
                        "background":"#198754",
                        "color":"white"
                    });

                }else{

                    $("#deduction_status").css({
                        "background":"#dc3545",
                        "color":"white"
                    });

                }

            }

        });

    });

</script>

</body>

</html>
